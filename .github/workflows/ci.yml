name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch makes the in-flight run redundant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    # The integration suite runs the real routes against this, so the SQL is
    # executed rather than asserted against a mock. It is the only thing that
    # would have caught db/schema.sql drifting behind the columns the routes
    # write.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soccer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs from the lockfile and runs postinstall, which copies
      # the vendored pdf-lib and fontkit into public/vendor/ -- the e2e PDF
      # tests need those and they are deliberately not committed.
      - name: Install dependencies
        run: npm ci

      - name: Unit and server tests
        run: npm test

      # The schema is applied by the suite itself, so there is no separate
      # migration step here.
      - name: Database integration tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/soccer_test

      # Keyed on the Playwright version, since browser builds are tied to it.
      # On a hit, the pretest:e2e hook becomes a no-op.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # playwright.config.js starts the app itself via its webServer block. It
      # needs no database of its own: the app serves its offline-first UI
      # without one, and the browser tests never sign in.
      - name: End-to-end tests
        run: npm run test:e2e

      # Traces are recorded on first retry, so this is what makes a flaky or
      # failing run diagnosable after the fact.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
